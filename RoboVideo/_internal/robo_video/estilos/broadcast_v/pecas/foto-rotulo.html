<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Broadcast (validado) / foto com rotulo superior (foto_destaque: foto, camada principal).
     Sobre o footage: rotulo espacado no canto superior esquerdo com barra vermelha ("THE VEHICLES"),
     foto centralizada com moldura branca fina e legenda curta em caixinha azul-marinho com
     barra vermelha logo acima do ticker ("NOT A CRITICISM"). -->
<link rel="stylesheet" href="../comum/bv.css">
<style>
  #fw { position: absolute; left: 424px; top: 210px; width: 1172px; height: 656px; border: 3px solid #f2f4f7;
        background: #111a28; overflow: hidden; box-shadow: 0 16px 44px rgba(0,0,0,.35); transform-origin: 50% 50%; }
  #foto { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; }
  #lg { position: absolute; left: 960px; top: 890px; height: 50px; display: flex; align-items: center;
        background: rgba(19, 33, 56, .96); padding: 0 18px 0 22px; transform: translateX(-50%); }
  #lg::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--acento); }
  #lgt { font-size: 29px; line-height: 1; }
</style>
</head>
<body>
<div class="rotsup" id="tt"><div class="barra"></div><div class="t" id="ttt"></div></div>
<div id="fw"><img id="foto" alt=""></div>
<div id="lg"><div id="lgt" class="cond"></div></div>
<script src="../comum/bv.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let DUR = 4200, temLeg = true;

  window.montar = function (d) {
    d = d || {};
    BC.tema(d);
    DUR = d.dur_ms || 4200;
    if (d.midia_url) $('foto').src = d.midia_url;
    $('ttt').textContent = BC.encurtar(BC.txt(d.texto || d.rotulo), 40);
    let leg = BC.txt(d.legenda);
    if (leg && d.texto && leg.toLowerCase() === BC.txt(d.texto).toLowerCase()) leg = '';
    temLeg = !!leg;
    BC.caberTexto($('lgt'), BC.encurtar(leg, 46), 29, 22, 1000, 0);
    if (!temLeg) $('lg').style.display = 'none';
    window.eventos = [{ evento: 'foto.entra', ms: 150 }];
  };

  window.quadro = function (t) {
    const S = DUR - t;
    const ks = BC.ei(BC.lin(-S, -380, -30));
    // rotulo superior "digitado" (revela da esquerda)
    const kt = BC.lin(t, 0, 700);
    $('ttt').style.clipPath = `inset(0 ${((1 - kt) * 100).toFixed(3)}% 0 0)`;
    $('tt').style.opacity = (BC.lin(t, 0, 120) * (1 - ks)).toFixed(3);
    // foto: sobe/escala de leve
    const kf = BC.eo(BC.lin(t, 150, 620));
    $('fw').style.opacity = (kf * (1 - ks)).toFixed(3);
    $('fw').style.transform = `translateY(${((1 - kf) * 30).toFixed(2)}px) scale(${(0.94 + 0.06 * kf - 0.03 * ks).toFixed(4)})`;
    $('foto').style.transform = `scale(${(1.0 + 0.05 * BC.lin(t, 0, DUR)).toFixed(4)})`;
    // legenda
    const kl = BC.eo(BC.lin(t, 900, 1250));
    $('lg').style.opacity = (kl * (1 - ks)).toFixed(3);
    $('lg').style.clipPath = `inset(0 ${((1 - kl) * 100).toFixed(3)}% 0 0)`;
  };
})();
</script>
</body>
</html>
