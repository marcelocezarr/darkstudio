<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Kinético (validado) / versus (contrastes): duas caixas escuras com os nomes em Impact branco entram
     pelos lados e se encontram num quadrado limão com o conector ("VS", "MAS"...) em preto. -->
<link rel="stylesheet" href="../comum/kv.css">
<style>
  .lado { position: absolute; top: 450px; height: 180px; line-height: 180px; padding: 0 44px; white-space: nowrap;
          font-family: var(--f-titulo); color: var(--texto); font-size: 120px; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
  .lado span { display: inline-block; transform-origin: 0 50%; }
  #vs { position: absolute; top: 430px; width: 220px; height: 220px; left: 850px; line-height: 220px; text-align: center;
        font-family: var(--f-titulo); font-size: 110px; color: var(--tinta); background: var(--acento); white-space: nowrap;
        box-shadow: 0 10px 28px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="a" class="lado cx"><span></span></div>
<div id="b" class="lado cx"><span></span></div>
<div id="vs"></div>
<script src="../comum/kv.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ESTREITO = 0.86;
  let d = {}, DUR = 4200, T_VS = 320;

  function preparar(el, txt) {
    const sp = el.firstChild;
    sp.textContent = K.maiusc(txt, d.idioma);
    let fs = 120;
    while (fs > 50 && sp.offsetWidth * ESTREITO > 640) { fs -= 4; el.style.fontSize = fs + 'px'; }
    sp.style.transform = `scaleX(${ESTREITO})`;
    el.style.width = Math.round(sp.offsetWidth * ESTREITO + 88) + 'px';
    return el.offsetWidth;
  }

  window.montar = function (dados) {
    d = K.iniciar(dados);
    DUR = d.dur_ms || 4200;
    const wa = preparar($('a'), d.a || ''), wb = preparar($('b'), d.b || '');
    $('a').style.left = (850 - 14 - wa) + 'px';
    $('b').style.left = (1070 + 14) + 'px';
    const vs = $('vs');
    vs.textContent = K.maiusc(d.conector || K.rot(d, 'versus', 'VS'), d.idioma);
    let fv = 110;
    const mv = document.createElement('span'); mv.textContent = vs.textContent; mv.style.whiteSpace = 'nowrap'; vs.textContent = ''; vs.appendChild(mv);
    while (fv > 40 && mv.offsetWidth > 190) { fv -= 6; vs.style.fontSize = fv + 'px'; }
    window.eventos = [{ evento: 'cena.abre', ms: 0 }, { evento: 'versus.choque', ms: T_VS }];
  };

  window.quadro = function (t) {
    const s = K.inCubic(K.prog(t, DUR - 240, 240));
    const ka = K.outExpo(K.prog(t, 0, 320)), kb = K.outExpo(K.prog(t, 90, 320));
    $('a').style.transform = `translateX(${((1 - ka) * -900 - s * 120).toFixed(1)}px)`;
    $('b').style.transform = `translateX(${((1 - kb) * 900 + s * 120).toFixed(1)}px)`;
    $('a').style.opacity = String(1 - s); $('b').style.opacity = String(1 - s);
    const kv = K.prog(t, T_VS, 200);
    $('vs').style.transform = `scale(${(t < T_VS ? 0 : K.outBack(kv, 2.4) * (1 - s)).toFixed(4)}) rotate(${((1 - K.outExpo(kv)) * -12).toFixed(2)}deg)`;
  };
})();
</script>
</body>
</html>
