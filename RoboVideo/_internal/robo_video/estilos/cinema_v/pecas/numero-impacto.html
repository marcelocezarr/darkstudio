<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Cinema (validado) / numero-impacto (fatos: numero, percentual, moeda, ano).
     Referencia: footage bem escurecido; numero dourado serifado centralizado ("8") e, logo abaixo,
     rotulo em sans caixa alta muito espacado ("YEARS OF BATTERY WARRANTY"). Entrada em fade lento
     com leve subida/desfoque; saida em fade. Unidade longa (" anos") vai para o rotulo. -->
<link rel="stylesheet" href="../comum/cv.css">
<style>
  #bloco { position: absolute; left: 0; width: 1920px; top: 0; height: 1080px; }
  #num { position: absolute; left: 0; width: 1920px; text-align: center; top: 408px;
         font-family: var(--fonte-numero); font-weight: 500; color: var(--acento); font-size: 200px; line-height: 1;
         white-space: nowrap; font-variant-numeric: lining-nums; opacity: 0; }
  #num .af { font-size: .55em; vertical-align: .5em; margin: 0 .06em; }
  #rot { position: absolute; left: 160px; width: 1600px; text-align: center; top: 640px; color: var(--texto);
         font-size: 38px; letter-spacing: .36em; margin-right: -.36em; white-space: normal; line-height: 1.5;
         opacity: 0; }
</style>
</head>
<body>
<div class="veu" id="veu"></div>
<div id="bloco">
  <div id="num"><span id="numi"></span></div>
  <div id="rot" class="rotulo"></div>
</div>
<script src="../comum/cv.js"></script>
<script>
(() => {
  const C = window.CV, $ = (s) => document.querySelector(s);
  const veu = $('#veu'), num = $('#num'), numi = $('#numi'), rot = $('#rot');
  let d = {}, DUR = 3600;

  function formatar(v) {
    const dec = Math.max(0, Math.min(3, Number(d.decimais) || 0));
    if (d.ano) return String(Math.round(v));
    let [int, fr] = Math.abs(v).toFixed(dec).split('.');
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, d.separador_milhar == null ? ',' : d.separador_milhar);
    return (v < 0 ? '-' : '') + (fr ? int + (d.separador_decimal || '.') + fr : int);
  }

  window.montar = function (dados) {
    d = dados || {};
    C.tema(d);
    DUR = d.dur_ms || 3600;
    const pre = C.txt(d.prefixo), suf = String(d.sufixo || '');
    const sufCurto = suf.trim().length <= 3 ? suf.trim() : '';
    const sufLongo = sufCurto ? '' : suf.trim();
    const n = Number(d.numero);
    const corpo = Number.isFinite(n) ? formatar(n) : C.txt(d.numero_texto || d.texto);
    numi.innerHTML = (pre ? `<span class="af">${C.esc(pre)}</span>` : '') + C.esc(corpo) +
      (sufCurto ? `<span class="af">${C.esc(sufCurto)}</span>` : '');
    let s0 = 208; num.style.fontSize = s0 + 'px';
    while (s0 > 100 && numi.getBoundingClientRect().width > 1500) { s0 -= 4; num.style.fontSize = s0 + 'px'; }
    // rotulo: unidade longa + resto da oracao ("years" + "of battery warranty")
    const r = C.txt([sufLongo, C.txt(d.legenda)].filter(Boolean).join(' '));
    rot.textContent = r;
    rot.style.display = r ? '' : 'none';
    if (r) {
      let s = 38;
      rot.style.fontSize = s + 'px';
      while (s > 24 && rot.getBoundingClientRect().height > s * 1.5 * 2 + 2) { s -= 2; rot.style.fontSize = s + 'px'; }
    }
    // numero centrado verticalmente no bloco numero+rotulo (como na referencia: centro ~ 47% da altura)
    const hn = num.getBoundingClientRect().height;
    num.style.top = (611 - hn * 0.86) + 'px';
    window.eventos = [{ evento: 'cena.abre', ms: 0 }, { evento: 'numero.impacto', ms: Math.round(Math.min(420, DUR * 0.12)) }];
  };

  window.quadro = function (t) {
    const sai = C.suave(C.fase(DUR - t, 0, Math.min(650, DUR * 0.22)));
    veu.style.opacity = String(Math.min(C.suave(C.fase(t, 0, 600)), sai));
    const kn = C.sai(C.fase(t, 250, 800));
    C.revela(num, Math.min(kn, sai), 16, 8);
    const kr = C.sai(C.fase(t, 420, 800));
    C.revela(rot, Math.min(kr, sai), 10, 5);
  };
})();
</script>
</body>
</html>
