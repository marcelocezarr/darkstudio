<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Cinema (validado) / foto-destaque (foto_destaque: foto, fotos; camada FUNDO, tela cheia opaca).
     Referencia: fundo grafite com grade finissima (celula 96 px), foto grande centralizada com filete
     claro e sombra, fio dourado que cresce sob a foto (esquerda -> direita) e legenda serifada pequena
     embaixo a esquerda ("The fall in value"). Com varias midias, a proxima foto entra deslizando da
     direita (como a troca "The fall in value" -> "Better used buys" da referencia). -->
<link rel="stylesheet" href="../comum/cv.css">
<style>
  body { background-color: #17181b;
         background-image: linear-gradient(90deg, rgba(255,255,255,.055) 0 2px, transparent 2px),
                           linear-gradient(0deg, rgba(255,255,255,.055) 0 2px, transparent 2px);
         background-size: 96px 96px; background-position: 2px 2px; }
  #vinheta { position: absolute; inset: 0;
             background: radial-gradient(ellipse 80% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }
  #quadro { position: absolute; left: 184px; top: 200px; width: 1628px; height: 698px; overflow: hidden;
            background: #0c0c0e; box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1.5px rgba(236,230,218,.55); }
  #quadro img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover;
                transform-origin: 50% 50%; filter: saturate(.86) contrast(1.03) brightness(.98); }
  #fio { position: absolute; left: 184px; top: 913px; width: 1628px; height: 2px; transform: scaleX(0); }
  #leg { position: absolute; left: 182px; top: 931px; max-width: 1400px; font-family: var(--fonte-titulo);
         font-weight: 400; color: var(--texto); font-size: 56px; line-height: 1.1; opacity: 0; }
</style>
</head>
<body>
<div id="vinheta"></div>
<div id="quadro"></div>
<div id="fio" class="fio"></div>
<div id="leg"></div>
<script src="../comum/cv.js"></script>
<script>
(() => {
  const C = window.CV, $ = (s) => document.querySelector(s);
  const quadro = $('#quadro'), fio = $('#fio'), leg = $('#leg');
  let DUR = 4000, imgs = [], trocas = [];
  const DESLIZA = 650;

  window.montar = function (dados) {
    const d = dados || {};
    C.tema(d);
    DUR = d.dur_ms_real || d.dur_ms || 4000;              // saida (ultimos 600 ms) e do motor
    const lista = (Array.isArray(d.midias) ? d.midias : []).filter(Boolean);
    let urls = d.subtipo === 'fotos' && lista.length > 1 ? lista : [d.midia_url || lista[0]].filter(Boolean);
    urls = urls.slice(0, Math.max(1, Math.min(4, Math.floor(DUR / 1800))));
    imgs = urls.map((u) => { const i = document.createElement('img'); i.src = u; i.alt = ''; quadro.appendChild(i); return i; });
    trocas = imgs.map((_, k) => Math.round((DUR * k) / imgs.length));
    // legenda curta: o nome do item (como "The fall in value"); sem nome -> o texto do beat
    const texto = C.txt(d.texto) || C.txt(d.legenda);
    leg.textContent = texto;
    leg.style.display = texto ? '' : 'none';
    if (texto) C.caber(leg, 1400, 56 * 1.1 * 2 + 2, 56, 32);
    window.eventos = [{ evento: 'foto.entra', ms: 0 }].concat(trocas.slice(1).map((ms) => ({ evento: 'foto.desliza', ms })));
  };

  window.quadro = function (t) {
    // fotos: a k-esima entra deslizando da direita no instante trocas[k]
    imgs.forEach((im, k) => {
      const ini = trocas[k], fim = k + 1 < imgs.length ? trocas[k + 1] : Infinity;
      const kin = k === 0 ? 1 : C.io(C.fase(t, ini, DESLIZA));
      const kout = fim === Infinity ? 0 : C.io(C.fase(t, fim, DESLIZA));
      const x = (1 - kin) * 100 - kout * 100;
      const vida = C.fase(t, ini, Math.max(1, (fim === Infinity ? DUR : fim) - ini + DESLIZA));
      im.style.transform = `translateX(${x.toFixed(3)}%) scale(${(1.0 + 0.025 * vida).toFixed(5)})`;
      im.style.visibility = t + 1 < ini || (fim !== Infinity && t > fim + DESLIZA) ? 'hidden' : 'visible';
    });
    // fio dourado cresce depois que a foto assenta; legenda sobe/nitida em seguida
    const kf = C.io(C.fase(t, Math.min(900, DUR * 0.22), Math.min(1100, DUR * 0.3)));
    fio.style.transform = `scaleX(${kf.toFixed(4)})`;
    C.revela(leg, C.sai(C.fase(t, Math.min(1300, DUR * 0.32), 700)), 10, 6);
  };
})();
</script>
</body>
</html>
