<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Broadcast / carrossel (foto_destaque: fotos) -- camada FUNDO (opaca, tela cheia).
     2..4 imagens em cartoes que deslizam da direita para a esquerda sobre fundo marinho
     com listras diagonais; contador "1/3", selo e tarja com o nome. -->
<link rel="stylesheet" href="../comum/bc.css">
<style>
  body { background: var(--navy); }
  #fundo { position: absolute; inset: 0;
           background: repeating-linear-gradient(-60deg, rgba(255,255,255,.028) 0 2px, rgba(0,0,0,0) 2px 46px),
                       linear-gradient(180deg, var(--navy2), var(--navy)); }
  #pista { position: absolute; inset: 0; }
  .card { position: absolute; left: 50%; top: 110px; width: 1280px; height: 720px; margin-left: -640px;
          background: #0b1d38; box-shadow: 0 30px 70px rgba(0,0,0,.5); overflow: hidden; transform-origin: 50% 50%; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .veu { position: absolute; inset: 0; background: var(--navy); }
  .card .borda { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--acento); transform-origin: left; }
  #selow { position: absolute; left: 96px; top: 54px; }
  #selo { font-size: 30px; }
  #cont { position: absolute; right: 96px; top: 54px; display: flex; align-items: center; gap: 10px; }
  #cont i { display: block; width: 44px; height: 8px; background: rgba(255,255,255,.28); }
  #cont i.on { background: var(--acento); }
  #tarja { position: absolute; left: 50%; margin-left: -640px; top: 862px; display: flex; align-items: stretch; }
  #lado { width: 14px; background: var(--acento); }
  #nome { padding: 12px 70px 10px 26px; font-weight: 700; font-size: 66px; line-height: 1.02;
          text-transform: uppercase; white-space: nowrap; background: var(--branco); color: var(--navy); }
  #cortina { position: absolute; top: 0; bottom: 0; left: -240px; width: 2400px; background: var(--navy); }
  #cortina::after { content: ''; position: absolute; left: -2px; top: 0; bottom: 0; width: 26px; background: var(--acento); }
</style>
</head>
<body>
<div id="fundo"></div>
<div id="pista"></div>
<div id="selow"><div id="selo" class="tag"><span class="ponto"></span><span id="selot"></span></div></div>
<div id="cont"></div>
<div id="tarja"><div id="lado"></div><div id="nw"><div id="nome" class="corte-d"></div></div></div>
<div id="cortina"></div>
<script src="../comum/bc.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let DUR = 6000, cards = [], marcas = [], n = 1, T_IN = 520, SEG = 2000, TR = 520;
  const PASSO = 1360;

  window.montar = function (d) {
    d = d || {};
    BC.tema(d);
    DUR = d.dur_ms || 6000;
    let urls = (Array.isArray(d.midias) ? d.midias : []).filter(Boolean).slice(0, 4);
    if (!urls.length && d.midia_url) urls = [d.midia_url];
    n = Math.max(1, urls.length);
    const pista = $('pista');
    pista.innerHTML = '';
    cards = (urls.length ? urls : ['']).map((u) => {
      const c = document.createElement('div'); c.className = 'card';
      if (u) { const im = document.createElement('img'); im.src = u; im.alt = ''; c.appendChild(im); }
      const v = document.createElement('div'); v.className = 'veu'; c.appendChild(v);
      const b = document.createElement('div'); b.className = 'borda'; c.appendChild(b);
      pista.appendChild(c); return c;
    });
    $('cont').innerHTML = '';
    marcas = cards.map(() => { const i = document.createElement('i'); $('cont').appendChild(i); return i; });
    if (n < 2) $('cont').style.display = 'none';
    $('selot').textContent = BC.rot(d, 'broadcast_em_foco') || BC.rot(d, 'destaque');
    const nome = BC.txt(d.texto || d.nome);
    $('tarja').style.display = nome ? '' : 'none';
    if (nome) BC.caberTexto($('nome'), nome, 66, 40, 1100, 0);
    T_IN = 520;
    TR = Math.min(560, Math.max(320, (DUR - T_IN - 400) / (n * 3)));
    SEG = (DUR - T_IN - 300) / n;       // tempo por imagem (inclui a transicao)
    const ev = [{ evento: 'foto.entra', ms: 0 }];
    for (let i = 1; i < n; i++) ev.push({ evento: 'foto.desliza', ms: Math.round(T_IN + i * SEG - TR) });
    window.eventos = ev;
  };

  // indice continuo da imagem em foco
  function foco(t) {
    let p = 0;
    for (let i = 1; i < n; i++) p += BC.eio(BC.lin(t, T_IN + i * SEG - TR, T_IN + i * SEG));
    return p;
  }

  window.quadro = function (t) {
    const S = DUR - t;
    const kc = BC.eio(BC.lin(t, 0, T_IN));
    $('cortina').style.transform = `translateX(${(kc * 2620).toFixed(1)}px) skewX(-14deg)`;
    $('cortina').style.display = kc >= 1 ? 'none' : '';
    const p = foco(t);
    // entrada: os cartoes chegam da direita junto com a cortina
    const entra = (1 - BC.expo(BC.lin(t, 120, T_IN + 380))) * 700;
    cards.forEach((c, j) => {
      const off = j - p;
      const a = Math.min(1, Math.abs(off));
      const esc = 1 - 0.2 * a;
      const x = off * PASSO * 0.84 + entra;
      c.style.transform = `translateX(${x.toFixed(1)}px) scale(${esc.toFixed(4)})`;
      c.style.zIndex = String(10 - Math.round(Math.abs(off) * 2));
      c.querySelector('.veu').style.opacity = (0.62 * a).toFixed(3);
      const img = c.querySelector('img');
      if (img) img.style.transform = `scale(${(1.03 + 0.05 * BC.lin(t, T_IN + (j - 1) * SEG, T_IN + (j + 1) * SEG)).toFixed(5)})`;
      c.querySelector('.borda').style.transform = `scaleX(${(1 - a).toFixed(4)})`;
    });
    const atual = Math.round(p);
    marcas.forEach((m, i) => m.classList.toggle('on', i === atual));
    BC.wipe($('selow'), BC.eo(BC.lin(t, 420, 740)), BC.ei(BC.lin(-S, -320, -100)), 20);
    BC.wipe($('cont'), BC.eo(BC.lin(t, 480, 800)), BC.ei(BC.lin(-S, -320, -100)), 20);
    BC.wipeV($('lado'), BC.eo(BC.lin(t, 460, 700)), BC.ei(BC.lin(-S, -160, 0)));
    BC.wipe($('nw'), BC.eo(BC.lin(t, 540, 960)), BC.ei(BC.lin(-S, -360, -60)));
  };
})();
</script>
</body>
</html>
