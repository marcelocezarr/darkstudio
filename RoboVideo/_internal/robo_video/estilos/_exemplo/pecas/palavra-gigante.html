<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Peca de referencia do contrato: palavra-gigante (familia impactos).
     JS puro em funcao de t: nada de timers/requestAnimationFrame. -->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  #palco { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frase { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 38px; max-width: 1500px;
           font-family: var(--fonte-titulo); font-size: 150px; line-height: 1.05; text-transform: uppercase;
           color: var(--texto); text-align: center; }
  .p { display: inline-block; opacity: 0; text-shadow: 0 10px 40px var(--sombra); will-change: transform, opacity; }
  .p.acento { color: var(--acento); }
</style>
</head>
<body>
<div id="palco"><div id="frase"></div></div>
<script>
(() => {
  const el = document.getElementById('frase');
  let dados = {}, spans = [], entradas = [], DUR = 2000;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  window.montar = function (d) {
    dados = d || {};
    DUR = dados.dur_ms || 2000;
    const r = document.documentElement.style;
    const pal = (dados.estilo && dados.estilo.paleta) || {};
    const fon = (dados.estilo && dados.estilo.fontes) || {};
    r.setProperty('--texto', pal.texto || '#fff');
    r.setProperty('--acento', pal.acento || '#e5252a');
    r.setProperty('--sombra', pal.sombra || 'rgba(0,0,0,.55)');
    r.setProperty('--fonte-titulo', fon.titulo || "'Arial Black', sans-serif");
    const palavras = String(dados.texto || '').split(/\s+/).filter(Boolean);
    // ajusta o tamanho da fonte ao comprimento do texto
    const n = palavras.join(' ').length;
    el.style.fontSize = (n > 28 ? 110 : n > 16 ? 130 : 160) + 'px';
    el.innerHTML = '';
    spans = palavras.map((w, i) => {
      const s = document.createElement('span');
      s.className = 'p' + (i === palavras.length - 1 ? ' acento' : '');
      s.textContent = w;
      el.appendChild(s);
      return s;
    });
    // entrada de cada palavra: no tempo em que e falada (dados.palavras[].ms) ou escalonada
    const falas = Array.isArray(dados.palavras) ? dados.palavras : [];
    entradas = spans.map((_, i) => (falas[i] && falas[i].ms != null) ? Math.min(falas[i].ms, DUR * 0.6) : i * 110);
    window.eventos = [{ evento: 'palavra.slam', ms: 0 }];
  };

  window.quadro = function (t) {
    const saida = clamp((DUR - t) / 280, 0, 1);  // fade-out nos ultimos 280 ms
    spans.forEach((s, i) => {
      const k = clamp((t - entradas[i]) / 260, 0, 1);
      const esc = 1.6 - 0.6 * easeOutBack(k);
      s.style.opacity = String(Math.min(k * 1.8, 1) * saida);
      s.style.transform = `translateY(${(1 - k) * 40}px) scale(${esc.toFixed(4)})`;
    });
  };
})();
</script>
</body>
</html>
