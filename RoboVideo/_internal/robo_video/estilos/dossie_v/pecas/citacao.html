<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<!-- Dossie validado: citacao. Deduzida: footage escurecido, cartao creme (mesmo papel das polaroides) com a
     fala datilografada em tinta escura, aspas vermelhas grandes e o autor na etiqueta escura. -->
<link rel="stylesheet" href="_comum.css">
<style>
  #cartao { position: absolute; left: 360px; width: 1200px; top: 250px; padding: 70px 90px 58px 150px; opacity: 0;
            transform-origin: 50% 50%; }
  #aspas { position: absolute; left: 30px; top: -6px; font-family: Georgia, 'Times New Roman', serif; font-weight: 700;
           color: var(--vermelho); font-size: 190px; line-height: 1; }
  #txt { font-size: 44px; line-height: 1.34; color: var(--tinta); text-transform: none; letter-spacing: 0; }
  #tag { position: absolute; left: auto; right: 90px; top: auto; bottom: -26px; opacity: 0; }
</style>
</head>
<body>
<div id="escuro"></div>
<div id="cartao" class="pola"><div id="aspas">“</div><div id="txt" class="maquina"></div>
  <div id="tag" class="tag"><span id="tagt"></span></div></div>
<script src="_comum.js"></script>
<script>
(() => {
  const V = window.DV;
  const esc = document.getElementById('escuro'), cartao = document.getElementById('cartao'), txt = document.getElementById('txt');
  const tag = document.getElementById('tag'), tagt = document.getElementById('tagt');
  let DUR = 4500, T_DIG = 1800, temAutor = false, rotF = -0.6;

  window.montar = function (dados) {
    const d = dados || {};
    V.aplicarEstilo(d);
    DUR = d.dur_ms || 4500;
    const texto = V.txt(d.texto).replace(/^["“”«»']+|["“”«»']+$/g, '');
    V.prepararDatilo(txt, texto);
    V.caber(txt, 44, 28, 420);
    const h = cartao.getBoundingClientRect().height;
    cartao.style.top = Math.round((1080 - h) / 2 - 20) + 'px';
    const autor = V.semPonto(d.autor);
    temAutor = !!autor;
    V.prepararDatilo(tagt, autor ? '— ' + autor : '');
    if (!autor) tag.style.display = 'none';
    T_DIG = Math.min(DUR * 0.55, 300 + Array.from(texto).length * 30);
    rotF = -0.8 + V.rnd(texto, 1) * 1.2;
    window.eventos = [{ evento: 'foto.entra', ms: 0 }, { evento: 'maquina.digita', ms: 320 }];
    if (autor) window.eventos.push({ evento: 'maquina.digita', ms: Math.round(320 + T_DIG) });
  };

  window.quadro = function (t) {
    const s = V.saida(t, DUR, 340);
    esc.style.opacity = String(0.5 * V.eo(V.seg(t, 0, 240)) * s);
    const kc = V.seg(t, 0, 320);
    cartao.style.opacity = String(Math.min(1, kc * 2) * s);
    cartao.style.transform = `translateY(${(22 * (1 - V.eo(kc))).toFixed(1)}px) rotate(${rotF.toFixed(2)}deg)`;
    V.datilo(txt, V.seg(t, 320, T_DIG), true);
    tag.style.opacity = String((temAutor && t > 320 + T_DIG ? 1 : 0) * s);
    V.datilo(tagt, V.seg(t, 320 + T_DIG, 420));
  };
})();
</script>
</body>
</html>
